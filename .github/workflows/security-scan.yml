name: "Shift-Left Security & Compliance Gate"

on:
  push:
    branches: ["main"]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".gitignore"
  pull_request:
    branches: ["main"]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".gitignore"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write

jobs:
  security-and-compliance:
    name: "Security & IaC Compliance Gate"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 1. Secret Scanning
      - name: Install Betterleaks
        run: |
          curl -sSLf https://github.com/betterleaks/betterleaks/releases/download/v1.8.1/betterleaks_1.8.1_linux_x64.tar.gz -o betterleaks.tar.gz
          tar -xzf betterleaks.tar.gz
          sudo mv betterleaks /usr/local/bin/
          rm -f betterleaks.tar.gz
          betterleaks --version

      - name: Run Betterleaks Scan
        run: |
          betterleaks git . \
            --config .betterleaks.toml \
            --report-format sarif \
            --report-path betterleaks-results.sarif \
            -v

      # 2. OpenTofu Static Analysis (TFLint)
      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: "v0.54.0"

      - name: Init & Run TFLint
        run: |
          tflint --init
          tflint --recursive -f compact

      # 3. Policy-as-Code (Checkov)
      - name: Run Checkov Compliance Scan
        uses: bridgecrewio/checkov-action@v12.2946.0
        with:
          directory: tofu/
          framework: terraform
          output_format: cli,sarif
          output_file_path: console,checkov-results.sarif
          compact: true
          quiet: true
          soft_fail: false

      # 4. Upload SARIF to GitHub Security Tab
      - name: Upload Betterleaks SARIF
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: betterleaks-results.sarif
          category: betterleaks

      - name: Upload Checkov SARIF
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: checkov-results.sarif
          category: checkov

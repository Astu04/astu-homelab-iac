[title]
description = "Repository Secrets Governance Baseline"

[allowlist]
description = "Ignore test fixtures, documentation, and known mock keys"
paths = [
    '''(^|/)docs/.*''',
    '''(^|/)\.terraform/.*''',
    '''(^|/)\.terraform\.lock\.hcl$''',
]
# Example: Ignore standard example dummy keys in comments
regexes = ['''(?i)EXAMPLE[_-]?KEY''', '''(?i)CHANGE[_-]?ME''']

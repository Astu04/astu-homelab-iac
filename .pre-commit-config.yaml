repos:
  # 1. Betterleaks: Next-Gen Secret & Token Scanner
  - repo: https://github.com/betterleaks/betterleaks
    rev: v1.8.1
    hooks:
      - id: betterleaks

  # 2. Terraform / OpenTofu Format & Linting
  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.109.0
    hooks:
      - id: terraform_fmt
      - id: terraform_tflint
        args:
          - --args=--config=.tflint.hcl

  # 3. Checkov: Policy-as-Code & Compliance (CIS / NIST)
  - repo: https://github.com/bridgecrewio/checkov
    rev: 3.3.15
    hooks:
      - id: checkov
        args:
          - --directory=tofu/
          - --framework=terraform
          - --compact
          - --quiet
